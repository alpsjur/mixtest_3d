run:
  name: baseline

ROMS: 
  yaml_loc: /home/ansju8054/Documents/Code/havvind-mix/mixtest_3d/roms

files:
  grd: mixtest_3d_grd.nc
  ini: mixtest_3d_ini.nc
  his: mixtest_3d_his.nc

grid:
  Lm: 50        # number of interior xi points
  Mm: 12        # number of interior eta points
  N: 40
  H0: 150.0     # uniform depth (m)
  DX: 800.0     # grid spacing xi (m)
  DY: 800.0     # grid spacing eta (m)

GLS:            # gen closure
  P: 2.0
  M: 1.0
  N: -0.67
  Kmin: 1.0
  Pmin: 1.0
  CMU0: 0.527
  C1: 1.0
  C2: 1.22
  C3M: 0.05
  C3P : 1.0
  SIGK: 0.8
  SIGP: 1.07

vertical:
  Vtransform: 2
  Vstretching: 5
  THETA_S: 5.0
  THETA_B: 4.0
  HC: 100.0

time_stepping:
  NTIMES: 24192  # 60480 for month, 241920 for four months
  DT: 40.0
  NHIS: 90

phys:
  F0: 0       # Coriolis (s^-1)
  RDRG2: 3    # Quadratic bottom drag (e-3)

structure:
  str_a: 0.0001           # about 4 turbines per grid cell
  depth_zero_below: 1.0e9 # set to a large number to keep full column non-zero
  CD: 0.63
  c4: 0.44                # strong mixing


initial:
  ocean_time_seconds: 0.0   # time stamp for the IC file

  # Temperature profile
  temp_T0: 20.0     # Surface temperatur
  temp_dT: 10.0     # temperature change across thermocline
  temp_zt: 40.0     # depth of thermocline center
  temp_ht: 10.0     # thickness of thermocline

  # Salinity (constant)
  salt_S0: 35.0